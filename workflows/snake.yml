name: generate snake

on:
  schedule:
    - cron: "0 3 * * *"   
  workflow_dispatch:       
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg (green theme)
        uses: Platane/snk@v3
        with:
          github_user_name: bktales
          outputs: |
            dist/github-snake.svg?color_snake=%2339ff14&color_dots=%230d1117,%230b3d2c,%23145c33,%231f8a4c,%2339ff14
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2339ff14&color_dots=%230d1117,%230b3d2c,%23145c33,%231f8a4c,%2339ff14

      - name: push svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
